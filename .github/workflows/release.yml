name: Windows release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-build.txt
      - run: pyinstaller --clean --noconfirm packaging/AstroChecker.spec
      - name: Check executable starts
        run: |
          $process = Start-Process -FilePath dist/AstroChecker.exe -ArgumentList '--no-browser','--port','0' -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) { throw "AstroChecker.exe si è chiuso con codice $($process.ExitCode)" }
          Stop-Process -Id $process.Id
      - name: Create checksum
        shell: pwsh
        run: (Get-FileHash dist/AstroChecker.exe -Algorithm SHA256).Hash + "  AstroChecker.exe" | Set-Content dist/SHA256SUMS.txt
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AstroChecker.exe
            dist/SHA256SUMS.txt
