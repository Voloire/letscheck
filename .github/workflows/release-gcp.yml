# Cloud Run release: tag v* -> tests -> image by digest -> Terraform plan checked by
# policy -> apply of that exact plan. Nothing runs from pushes or pull requests.
# Trust: voloirex-lab bootstrap federates this workflow (path, tags v*) to lab-build,
# lab-plan and lab-deploy. See docs/superpowers/plans/2026-09-06-gcp-cloud-run.md.
name: Cloud Run release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-release
  cancel-in-progress: false

env:
  PROJECT_ID: voloirex-lab
  REGION: europe-west1
  REGISTRY: europe-west1-docker.pkg.dev
  IMAGE: europe-west1-docker.pkg.dev/voloirex-lab/lab/astrochecker
  WIF_PROVIDER: projects/262633132420/locations/global/workloadIdentityPools/github/providers/github

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m compileall -q astrochecker tests scripts
      - run: node --check astrochecker/static/app.js
      - run: python -m pytest -q

  release:
    needs: test
    runs-on: ubuntu-24.04
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Authenticate build identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: lab-build@voloirex-lab.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Build and push the image, capture its digest
        id: image
        run: |
          gcloud auth configure-docker "$REGISTRY" --quiet
          tag="$IMAGE:$GITHUB_REF_NAME-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker build --pull -t "$tag" .
          docker push "$tag"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$tag")
          case "$digest" in "$IMAGE@sha256:"*) ;; *) echo "Unexpected digest $digest" >&2; exit 1;; esac
          echo "ref=$digest" >> "$GITHUB_OUTPUT"
          printf '## Image\n\n`%s`\n\n' "$digest" >> "$GITHUB_STEP_SUMMARY"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Authenticate plan identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: lab-plan@voloirex-lab.iam.gserviceaccount.com

      - name: Plan and check the saved plan
        env:
          TF_VAR_image: ${{ steps.image.outputs.ref }}
        run: |
          umask 077
          terraform -chdir=infra/gcp init -input=false -lockfile=readonly
          terraform -chdir=infra/gcp validate
          terraform -chdir=infra/gcp plan -input=false -no-color -out="$RUNNER_TEMP/astrochecker.tfplan"
          terraform -chdir=infra/gcp show -json "$RUNNER_TEMP/astrochecker.tfplan" > "$RUNNER_TEMP/astrochecker.tfplan.json"
          {
            printf '## Plan policy\n\n```\n'
            python3 scripts/plan_policy.py "$RUNNER_TEMP/astrochecker.tfplan.json"
            printf '```\n\n<details><summary>Full plan</summary>\n\n```\n'
            terraform -chdir=infra/gcp show -no-color "$RUNNER_TEMP/astrochecker.tfplan"
            printf '```\n\n</details>\n\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Authenticate apply identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: lab-deploy@voloirex-lab.iam.gserviceaccount.com

      - name: Apply this exact saved plan
        run: |
          terraform -chdir=infra/gcp apply -input=false -no-color "$RUNNER_TEMP/astrochecker.tfplan"
          printf '## Released\n\n%s\n' "$(terraform -chdir=infra/gcp output -raw public_url)" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove local plan files
        if: always()
        run: rm -f "$RUNNER_TEMP/astrochecker.tfplan" "$RUNNER_TEMP/astrochecker.tfplan.json"
